_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a real EU agency guide to missions: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one staff member's flight request under ENISA's Guide to missions and authorised travel (Management Board Decision MB/2018/6, applying the Commission's guide of 2017), read verbatim (about 14,100 words). It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares in euros) and submits a decision with the offer, cabin, reason, approver and guide section. A deterministic verifier rebuilds the offers and the guide's answer itself and checks every field. Thirty-two cases cover the 800 km rail test, business class on a four-hour segment, flexible fares for missions that may move, direct flights against manifestly unreasonable expense, the 08:00 and 22:00 travel hours, the class of an accompanied Commissioner, departures from leave or for personal reasons, authorised travel paid by an organiser, and the guide's own unclear words."
highlights:
  - "The verbatim guide: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 240 against 235 scheduled minutes, 800 against 790 km of rail, take-off at 08:00 against 07:55, landing at 22:00 against 22:05"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example linden-harbour, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the guide's answer and checks every field"
